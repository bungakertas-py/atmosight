name: build-and-deploy

# ================= SAKLAR MODEL TAMBAHAN =================
# Primeon Atmos tahap awal SENGAJA cuma memasak GFS. Langkah WRF Citarum dan
# Private Model tetap ada di bawah, cuma dilewati.
#
# CARA MENYALAKAN LAGI: ubah MASAK_MODEL_EXTRA di bawah jadi "1". Lalu jangan
# lupa nyalakan juga MODEL_AKTIF di frontend/app.js, kalau tidak datanya masak
# tapi tak muncul di dropdown.
env:
  MASAK_MODEL_EXTRA: "0"

# Jalankan pipeline GFS + Citarum + WRF ITERA, lalu publish ke GitHub Pages.
# Deploy utama harian 21:00 UTC (04:00 WIB). Re-check ITERA (deploy kedua) ada
# di workflow terpisah deploy-itera.yml, 09:00 UTC (16:00 WIB): khusus menarik
# nc ITERA yang mungkin mendarat terlambat, TANPA menjalankan GFS/Citarum lagi
# (pakai output yang disimpan ke cache di sini).
on:
  # PEMICU PUSH JUGA DIMATIKAN selama masa penyiapan. Tanpa ini tiap commit
  # penggayaan ulang memicu masak 10 sampai 15 menit yang ujungnya gagal,
  # sebab GitHub Pages di repo ini belum disetel. Buang waktu dan bikin email
  # gagal beruntun. Buka lagi kalau sudah siap terbit.
  # push:
  #   branches: [main]
  # JADWAL OTOMATIS SENGAJA DIMATIKAN selama masa penyiapan, supaya repo baru
  # ini tidak ikut masak tiap subuh sebelum kita siap. Buka lagi kalau sudah
  # mau terbit.
  # schedule:
  #   # 04:00 WIB = 21:00 UTC (hari sebelumnya). Sekali sehari.
  #   - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # eccodes butuh pustaka C; wheel pip biasanya sudah membawa binernya,
      # tapi pasang libeccodes0 sistem sebagai jaring pengaman.
      - name: Install eccodes system lib (fallback)
        run: sudo apt-get update && sudo apt-get install -y libeccodes0

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Hydrate window from live site (retensi -24 jam)
        working-directory: backend/pipeline
        env:
          SITE_DATA_URL: https://bungakertas-py.github.io/primeon-atmos/backend/data/output
        run: python hydrate.py || true

      - name: Run pipeline (unduh GFS + generate output)
        working-directory: backend/pipeline
        run: python run.py

      # Model kedua: WRF Citarum, arsip 2018-2019 dari server terbuka ITB.
      # Tidak menambah dependensi apa pun, pembaca GeoTIFF-nya pure python.
      # Dibiarkan gagal-lunak: kalau server ITB mati, situs GFS tetap terbit,
      # cuma pilihan WRF yang kosong sampai run berikutnya.
      - name: Run pipeline WRF Citarum (model kedua)
        if: env.MASAK_MODEL_EXTRA == '1'
        working-directory: backend/pipeline
        env:
          WRF_WORKERS: "8"
        run: python wrf_run.py || echo "WRF dilewati, server sumber tak terjangkau"

      # Model ketiga: WRF Indonesia 9 km dari server ITERA. Server mendorong
      # satu nc per hari ke GitHub Release (repo data terpisah, publik). Di sini
      # kita tarik asset terbaru lalu olah jadi aset frontend. Buang 6 jam
      # spin-up. Gagal-lunak: kalau release kosong, situs tetap terbit tanpa
      # model ini.
      - name: Run pipeline WRF Indonesia (model ketiga)
        if: env.MASAK_MODEL_EXTRA == '1'
        working-directory: backend/pipeline
        env:
          WRF_ITERA_TRIM: "6"
          WRF_ITERA_VERIFY: "1"   # hitung akurasi lawan METAR tiap deploy
        run: |
          API=https://api.github.com/repos/bungakertas-py/kertas-cuaca-wrf-data/releases/tags/latest
          read NAME URL <<<"$(curl -sL "$API" | python -c "import sys,json; a=[x for x in json.load(sys.stdin).get('assets',[]) if x['name'].startswith('wrf_itera_') and x['name'].endswith('.nc')]; a.sort(key=lambda x: x['name']); print((a[-1]['name']+' '+a[-1]['browser_download_url']) if a else '')")"
          if [ -n "$URL" ]; then
            echo "unduh nc terbaru: $NAME"
            mkdir -p ../data/raw/wrf_itera
            if curl -sL -o ../data/raw/wrf_itera/latest.nc "$URL" && python wrf_itera_run.py; then
              echo "$NAME" > ../data/output/wrf_itera/source.txt   # penanda buat re-check deploy kedua
            else
              echo "WRF Indonesia gagal diolah, dilewati"
            fi
          else
            echo "WRF Indonesia dilewati, belum ada nc di release"
          fi

      # Simpan seluruh output situs (GFS + Citarum + ITERA) ke cache, supaya
      # deploy kedua (deploy-itera.yml) bisa republish situs dengan ITERA baru
      # TANPA menjalankan GFS/Citarum lagi. Kunci unik per run; deploy kedua
      # mengambil yang terbaru lewat restore-keys prefix "site-output-".
      - name: Simpan output ke cache untuk re-check ITERA
        uses: actions/cache/save@v4
        with:
          path: backend/data/output
          key: site-output-${{ github.run_id }}

      - name: Assemble site (jaga struktur ../backend/data/output)
        run: |
          mkdir -p _site/frontend _site/backend/data/output
          cp -r frontend/. _site/frontend/
          cp -r backend/data/output/. _site/backend/data/output/
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>Primeon Atmos — Peta cuaca interaktif Indonesia</title>
          <meta http-equiv="refresh" content="0; url=./frontend/index.html">
          <meta property="og:type" content="website">
          <meta property="og:site_name" content="Primeon Atmos">
          <meta property="og:title" content="Primeon Atmos — Peta cuaca interaktif Indonesia">
          <meta property="og:description" content="Angin, hujan, suhu, awan, dan tekanan untuk seluruh Indonesia. Klik lokasimu untuk prakiraan detail per jam.">
          <meta property="og:url" content="https://bungakertas-py.github.io/primeon-atmos/">
          <meta property="og:image" content="https://bungakertas-py.github.io/primeon-atmos/frontend/og-image.png">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:image" content="https://bungakertas-py.github.io/primeon-atmos/frontend/og-image.png">
          <a href="./frontend/index.html">Buka Primeon Atmos</a>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
